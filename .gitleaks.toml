# Project exceptions to the global policy config. @global resolves to it in the git hook wrapper.
[extend]
path = "@global"

[[allowlists]]
description = "SEC-7: the owner authorised the security-firm name anywhere in this project"
targetRules = ["policy-sec7-term-1"]
paths = [
  '''.*''',
]

[[allowlists]]
description = "SEC-1: certificate fingerprint prefixes (emSign ECC Root CA - G3, AAA Certificate Services), not MAC addresses"
targetRules = ["policy-sec1-mac-address"]
regexes = [
  '''(?i)^86:A1:EC:BA:08:9C$''',
  '''(?i)^D7:A7:A0:FB:5D:7E$''',
]

[[allowlists]]
description = "SEC-1: PROOF.md prints certificate SHA-256 fingerprints and serials, which contain MAC-shaped byte runs"
targetRules = ["policy-sec1-mac-address"]
paths = [
  '''^PROOF\.md$''',
  '''^site/proof(-[a-d])?\.md$''',
  '''^proof(-[a-d])?\.html$''',
]
